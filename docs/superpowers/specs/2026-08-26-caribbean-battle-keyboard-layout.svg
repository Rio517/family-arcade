<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Caribbean battle command deck</title>
  <desc id="desc">Action-first battle controls with small shortcut badges: turn port A, fire port Q, change shot S, change sail R, fire starboard E, turn starboard D, and pause Space.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3340"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#02090d" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1440" height="360" rx="24" fill="#07151d"/>
  <text x="34" y="43" fill="#c79a45" font-family="Georgia, serif" font-size="21" font-weight="700" letter-spacing="4">PLAYER COMMANDS</text>
  <text x="1406" y="43" text-anchor="end" fill="#f1d6a1" font-family="Arial, sans-serif" font-size="16">Shortcuts remain under the left hand</text>
  <path d="M30 66H1410" stroke="#c79a45" stroke-width="2" opacity="0.65"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <!-- Turn port -->
    <g transform="translate(30 88)">
      <rect width="180" height="206" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="2"/>
      <rect x="136" y="12" width="30" height="28" rx="6" fill="#f1d6a1"/>
      <text x="151" y="32" text-anchor="middle" fill="#07151d" font-size="14" font-weight="800">A</text>
      <path d="M119 74C91 49 52 59 42 91C35 113 47 134 67 143" fill="none" stroke="#c79a45" stroke-width="8" stroke-linecap="round"/>
      <path d="M47 126L68 145L43 153" fill="none" stroke="#c79a45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="180" text-anchor="middle" fill="#f1d6a1" font-size="20" font-weight="800">TURN PORT</text>
    </g>

    <!-- Fire port -->
    <g transform="translate(220 88)">
      <rect width="180" height="206" rx="12" fill="url(#panel)" stroke="#4ec5c1" stroke-width="3"/>
      <rect x="136" y="12" width="30" height="28" rx="6" fill="#f1d6a1"/>
      <text x="151" y="32" text-anchor="middle" fill="#07151d" font-size="14" font-weight="800">Q</text>
      <g transform="translate(32 62)" fill="none" stroke="#4ec5c1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M112 18L45 42L16 36L14 58L47 59L112 81Z"/>
        <circle cx="55" cy="88" r="17"/>
        <circle cx="102" cy="88" r="17"/>
      </g>
      <text x="90" y="180" text-anchor="middle" fill="#f1d6a1" font-size="20" font-weight="800">FIRE PORT</text>
    </g>

    <!-- Change shot -->
    <g transform="translate(410 88)">
      <rect width="220" height="206" rx="12" fill="#0b3340" stroke="#4ec5c1" stroke-width="3"/>
      <rect x="176" y="12" width="30" height="28" rx="6" fill="#f1d6a1"/>
      <text x="191" y="32" text-anchor="middle" fill="#07151d" font-size="14" font-weight="800">S</text>
      <g transform="translate(62 61)" fill="#c79a45" stroke="#f1d6a1" stroke-width="3">
        <circle cx="48" cy="31" r="23"/>
        <circle cx="22" cy="76" r="23"/>
        <circle cx="74" cy="76" r="23"/>
      </g>
      <text x="110" y="162" text-anchor="middle" fill="#f1d6a1" font-size="20" font-weight="800">CHANGE SHOT</text>
      <text x="110" y="188" text-anchor="middle" fill="#4ec5c1" font-size="13" font-weight="700">ROUND → CHAIN → GRAPE</text>
    </g>

    <!-- Change sail -->
    <g transform="translate(640 88)">
      <rect width="180" height="206" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="2"/>
      <rect x="136" y="12" width="30" height="28" rx="6" fill="#f1d6a1"/>
      <text x="151" y="32" text-anchor="middle" fill="#07151d" font-size="14" font-weight="800">R</text>
      <g transform="translate(46 55)" fill="none" stroke="#c79a45" stroke-width="6" stroke-linejoin="round">
        <path d="M46 5V112"/>
        <path d="M43 13L3 87H43Z" fill="#c79a45" fill-opacity="0.22"/>
        <path d="M51 28L87 93H51Z" fill="#c79a45" fill-opacity="0.22"/>
        <path d="M4 116H87"/>
      </g>
      <text x="90" y="180" text-anchor="middle" fill="#f1d6a1" font-size="20" font-weight="800">CHANGE SAIL</text>
    </g>

    <!-- Fire starboard -->
    <g transform="translate(830 88)">
      <rect width="220" height="206" rx="12" fill="url(#panel)" stroke="#e55243" stroke-width="3"/>
      <rect x="176" y="12" width="30" height="28" rx="6" fill="#f1d6a1"/>
      <text x="191" y="32" text-anchor="middle" fill="#07151d" font-size="14" font-weight="800">E</text>
      <g transform="translate(44 62)" fill="none" stroke="#e55243" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 18L83 42L112 36L114 58L81 59L16 81Z"/>
        <circle cx="28" cy="88" r="17"/>
        <circle cx="75" cy="88" r="17"/>
      </g>
      <text x="110" y="180" text-anchor="middle" fill="#f1d6a1" font-size="19" font-weight="800">FIRE STARBOARD</text>
    </g>

    <!-- Turn starboard -->
    <g transform="translate(1060 88)">
      <rect width="210" height="206" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="2"/>
      <rect x="166" y="12" width="30" height="28" rx="6" fill="#f1d6a1"/>
      <text x="181" y="32" text-anchor="middle" fill="#07151d" font-size="14" font-weight="800">D</text>
      <path d="M76 74C104 49 143 59 153 91C160 113 148 134 128 143" fill="none" stroke="#c79a45" stroke-width="8" stroke-linecap="round"/>
      <path d="M148 126L127 145L152 153" fill="none" stroke="#c79a45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="180" text-anchor="middle" fill="#f1d6a1" font-size="18" font-weight="800">TURN STARBOARD</text>
    </g>

    <!-- Pause -->
    <g transform="translate(1280 88)">
      <rect width="130" height="206" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="2"/>
      <rect x="65" y="12" width="51" height="28" rx="6" fill="#f1d6a1"/>
      <text x="90.5" y="31" text-anchor="middle" fill="#07151d" font-size="11" font-weight="800">SPACE</text>
      <rect x="40" y="65" width="16" height="72" rx="4" fill="#c79a45"/>
      <rect x="74" y="65" width="16" height="72" rx="4" fill="#c79a45"/>
      <text x="65" y="180" text-anchor="middle" fill="#f1d6a1" font-size="18" font-weight="800">PAUSE</text>
    </g>
  </g>

  <text x="34" y="331" fill="#f1d6a1" font-family="Arial, sans-serif" font-size="17">Action first. Shortcut badges remain visible, consistent, and secondary.</text>
</svg>
