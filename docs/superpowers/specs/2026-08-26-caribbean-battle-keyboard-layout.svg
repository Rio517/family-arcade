<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Caribbean battle left-hand keyboard layout</title>
  <desc id="desc">Q fires port, E fires starboard, R changes sail, A turns port, S changes shot, D turns starboard, and Space pauses.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3340"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#02090d" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="24" fill="#07151d"/>
  <path d="M28 82H1412" stroke="#c79a45" stroke-width="2" opacity="0.7"/>
  <text x="42" y="48" fill="#c79a45" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="4">PLAYER COMMAND DECK · LEFT-HAND QWERTY</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(48 108)">
      <rect width="260" height="112" rx="12" fill="url(#panel)" stroke="#4ec5c1" stroke-width="3"/>
      <text x="24" y="51" fill="#f1d6a1" font-size="42" font-weight="800">Q</text>
      <text x="24" y="86" fill="#f1d6a1" font-size="21" font-weight="700" letter-spacing="1">FIRE PORT</text>
    </g>
    <g transform="translate(604 108)">
      <rect width="280" height="112" rx="12" fill="url(#panel)" stroke="#e55243" stroke-width="3"/>
      <text x="24" y="51" fill="#f1d6a1" font-size="42" font-weight="800">E</text>
      <text x="24" y="86" fill="#f1d6a1" font-size="21" font-weight="700" letter-spacing="1">FIRE STARBOARD</text>
    </g>
    <g transform="translate(900 108)">
      <rect width="246" height="112" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="3"/>
      <text x="24" y="51" fill="#f1d6a1" font-size="42" font-weight="800">R</text>
      <text x="24" y="86" fill="#f1d6a1" font-size="21" font-weight="700" letter-spacing="1">CHANGE SAIL</text>
    </g>

    <g transform="translate(76 238)">
      <rect width="244" height="112" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="3"/>
      <text x="24" y="51" fill="#f1d6a1" font-size="42" font-weight="800">A</text>
      <text x="24" y="86" fill="#f1d6a1" font-size="21" font-weight="700" letter-spacing="1">TURN PORT</text>
    </g>
    <g transform="translate(336 238)">
      <rect width="252" height="112" rx="12" fill="#0b3340" stroke="#4ec5c1" stroke-width="4"/>
      <text x="24" y="44" fill="#4ec5c1" font-size="38" font-weight="800">S</text>
      <text x="24" y="76" fill="#f1d6a1" font-size="20" font-weight="700" letter-spacing="1">CHANGE SHOT</text>
      <text x="24" y="101" fill="#4ec5c1" font-size="13" font-weight="700">ROUND → CHAIN → GRAPE</text>
    </g>
    <g transform="translate(604 238)">
      <rect width="280" height="112" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="3"/>
      <text x="24" y="51" fill="#f1d6a1" font-size="42" font-weight="800">D</text>
      <text x="24" y="86" fill="#f1d6a1" font-size="21" font-weight="700" letter-spacing="1">TURN STARBOARD</text>
    </g>
    <g transform="translate(900 238)">
      <rect width="490" height="112" rx="12" fill="url(#panel)" stroke="#c79a45" stroke-width="3"/>
      <text x="24" y="51" fill="#f1d6a1" font-size="33" font-weight="800">SPACE</text>
      <text x="24" y="86" fill="#f1d6a1" font-size="21" font-weight="700" letter-spacing="1">PAUSE / RESUME</text>
    </g>
  </g>

  <text x="42" y="394" fill="#f1d6a1" font-family="Arial, sans-serif" font-size="18">Primary controls stay under the left hand; pointer and touch users can still select any shot directly.</text>
</svg>
